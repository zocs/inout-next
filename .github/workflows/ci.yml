name: Verify and package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A single repository-wide queue: do not overlap even different refs or triggers.
concurrency:
  group: inout-next-verification
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  APPIMAGE_EXTRACT_AND_RUN: '1'
  CI: 'true'

jobs:
  linux:
    name: Linux checks, browser flows and packages
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      product_slug: ${{ steps.product.outputs.slug }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock', 'apps/native-slint/Cargo.lock') }}
      - name: Linux native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libegl1-mesa-dev fonts-dejavu-core
      - name: Product and portable packaging checks
        id: product
        run: |
          python3 scripts/sync_product.py --check
          python3 -m unittest discover -s tests -v
          python3 - <<'PY'
          import json, os, re
          with open('product.json') as stream:
              product = json.load(stream)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('slug=' + product['slug'] + '\n')
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              version = product['version']
              if not re.fullmatch(r'v' + re.escape(version) + r'(?:-preview\.[1-9][0-9]*)?', os.environ['GITHUB_REF_NAME']):
                  raise SystemExit('Tag must match product.json version or its numbered preview')
          PY
      - name: Build local web assets
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/desktop
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run build
      - name: Rust core and native host verification
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo fmt --manifest-path apps/native-slint/Cargo.toml --check
          cargo test --workspace --locked
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          cargo test --manifest-path apps/native-slint/Cargo.toml --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path apps/native-slint/Cargo.toml --all-targets --locked -- -D warnings
          cargo build -p share-cli --locked
      - name: Real browser interactions
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          env -u NO_COLOR npm run test:e2e
      - name: Streamed runtime probe
        run: python3 scripts/verify_runtime.py --mib 128 --report .local/verification/runtime-128mib.json
      - name: Build server and Linux native bundles
        run: |
          cargo build -p share-cli --release --locked
          python3 scripts/package_portable.py --binary target/release/share-server --target linux-x64 --output .local/packages
          npm --prefix apps/desktop run tauri -- build --target x86_64-unknown-linux-gnu --bundles appimage,deb --config '{"build":{"beforeBuildCommand":""}}' -- --locked
          cargo test -p share-host --release --locked --test host asset_lookup_prefers_packaged_mapping_and_rejects_partial_folders
          cargo build --manifest-path apps/native-slint/Cargo.toml --release --locked --target x86_64-unknown-linux-gnu
          python3 scripts/package_native_slint.py --binary target/x86_64-unknown-linux-gnu/release/share-native-slint --target linux-x64 --output .local/packages
      - name: Verify emitted Debian identity across display rename
        run: python3 scripts/verify_native_identity.py --binary target/x86_64-unknown-linux-gnu/release/share-desktop --target x86_64-unknown-linux-gnu --bundle deb --report .local/verification/native-identity-linux-x64.json
      - name: Verify relocated Linux portable server
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys, tempfile, zipfile
          project = pathlib.Path.cwd()
          sys.path.insert(0, str(project / 'scripts'))
          from verify_runtime import verify
          with open('product.json') as stream:
              product = json.load(stream)
          archive = project / '.local/packages' / f'{product["slug"]}-{product["version"]}-linux-x64-server.zip'
          declared = archive.with_suffix('.zip.sha256').read_text().split()[0]
          with archive.open('rb') as stream:
              if hashlib.file_digest(stream, 'sha256').hexdigest() != declared:
                  raise SystemExit('Portable archive checksum differs')
          with tempfile.TemporaryDirectory(prefix='relocated-server-') as directory:
              relocated = pathlib.Path(directory)
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(relocated)
                  for entry in bundle.infolist():
                      (relocated / entry.filename).chmod((entry.external_attr >> 16) & 0o777)
              if json.loads((relocated / 'product.json').read_text()) != product:
                  raise SystemExit('Portable product metadata differs')
              os.chdir(relocated)
              report = verify(relocated / 'share-server', relocated / 'web', 8 * 1024 * 1024)
          os.chdir(project)
          output = project / '.local/verification/portable-relocation.json'
          output.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Preserve tested web export for later native builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-export
          path: apps/web/out/
          if-no-files-found: error
          retention-days: 7
      - name: Linux distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.product.outputs.slug }}-linux-x64
          path: |
            .local/packages/*
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
      - name: Validation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-verification
          path: |
            .local/verification/browser/results.json
            .local/verification/runtime-128mib.json
            .local/verification/portable-relocation.json
            .local/verification/native-identity-linux-x64.json
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android arm64 unsigned preview and package inspection
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock', 'apps/native-slint/Cargo.lock') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-export
          path: apps/web/out
      - name: Provision Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/inout-next-android-sdk
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Pinned Android build tools
        run: |
          sdkmanager --version
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          npm ci --prefix apps/desktop
          python3 scripts/prepare_android_assets.py
      - name: Locked optimized arm64 build and actual APK inspection
        run: |
          python3 scripts/build_android.py --abi aarch64 --export reuse --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --fetch-wrapper --report .local/verification/android-arm64-build.json
          apps/desktop/src-tauri/gen/android/gradlew -p tests/android-assets --no-daemon --no-configuration-cache --max-workers=2 test
      - name: Preserve unsigned Android candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.linux.outputs.product_slug }}-android-arm64-unsigned
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Android build verification records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-verification
          path: |
            .local/verification/android-arm64-build.json
            .local/android-build/*/locked-build.json
            .local/android-build/*/cargo-events.jsonl
            .local/android-build/*/build.stdout
            .local/android-build/*/build.stderr
            tests/android-assets/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows ${{ matrix.name }} tests and packages
    needs: [linux, android]
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - name: x86
            target: i686-pc-windows-msvc
            portable: windows-x86
          - name: x64
            target: x86_64-pc-windows-msvc
            portable: windows-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
          components: clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock', 'apps/native-slint/Cargo.lock') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-export
          path: apps/web/out
      - name: Target tests and warnings
        run: |
          npm ci --prefix apps/desktop
          cargo test --workspace --locked --target ${{ matrix.target }}
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
          cargo test --manifest-path apps/native-slint/Cargo.toml --locked --target ${{ matrix.target }}
          cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked --target ${{ matrix.target }} -- -D warnings
          cargo clippy --manifest-path apps/native-slint/Cargo.toml --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Target server and native bundles
        run: |
          cargo build -p share-cli --release --locked --target ${{ matrix.target }}
          python3 scripts/package_portable.py --binary target/${{ matrix.target }}/release/share-server.exe --target ${{ matrix.portable }} --output .local/packages
          npm --prefix apps/desktop run tauri -- build --target ${{ matrix.target }} --bundles nsis --config '{"build":{"beforeBuildCommand":""}}' -- --locked
          cargo build --manifest-path apps/native-slint/Cargo.toml --release --locked --target ${{ matrix.target }}
          python3 scripts/package_native_slint.py --binary target/${{ matrix.target }}/release/share-native-slint.exe --target ${{ matrix.portable }} --output .local/packages
      - name: Verify rendered NSIS identity across display rename
        run: python3 scripts/verify_native_identity.py --binary target/${{ matrix.target }}/release/share-desktop.exe --target ${{ matrix.target }} --bundle nsis --report .local/verification/native-identity-${{ matrix.portable }}.json
      - name: Verify native PE architecture and GUI subsystem
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          expected = 0x14c if '${{ matrix.name }}' == 'x86' else 0x8664
          artifacts = []
          for name in ('share-desktop.exe', 'share-native-slint.exe'):
              path = pathlib.Path('target/${{ matrix.target }}/release') / name
              data = path.read_bytes()
              if data[:2] != b'MZ':
                  raise SystemExit(f'{name} is not a PE executable')
              pe = struct.unpack_from('<I', data, 0x3c)[0]
              if data[pe:pe + 4] != b'PE\0\0':
                  raise SystemExit(f'{name} has no PE header')
              machine = struct.unpack_from('<H', data, pe + 4)[0]
              subsystem = struct.unpack_from('<H', data, pe + 24 + 68)[0]
              if machine != expected or subsystem != 2:
                  raise SystemExit(f'{name} must have the declared architecture and Windows GUI subsystem')
              artifacts.append({'file': name, 'machine': hex(machine), 'subsystem': subsystem, 'bytes': len(data)})
          report = {'architecture': '${{ matrix.name }}', 'artifacts': artifacts}
          output = pathlib.Path('.local/verification/native-pe-${{ matrix.portable }}.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.linux.outputs.product_slug }}-${{ matrix.portable }}
          path: |
            .local/packages/*
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            .local/verification/native-pe-*.json
            .local/verification/native-identity-${{ matrix.portable }}.json
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.name }} checks and packages
    needs: [linux, windows]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - name: arm64
            runner: macos-15
            target: aarch64-apple-darwin
            portable: macos-arm64
          - name: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            portable: macos-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
          components: clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock', 'apps/native-slint/Cargo.lock') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-export
          path: apps/web/out
      - name: macOS host tests and warnings
        run: |
          npm ci --prefix apps/desktop
          cargo test --workspace --locked
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          cargo test --manifest-path apps/native-slint/Cargo.toml --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path apps/native-slint/Cargo.toml --all-targets --locked -- -D warnings
      - name: Target server and native bundles
        run: |
          cargo build -p share-cli --release --locked --target ${{ matrix.target }}
          python3 scripts/package_portable.py --binary target/${{ matrix.target }}/release/share-server --target ${{ matrix.portable }} --output .local/packages
          npm --prefix apps/desktop run tauri -- build --target ${{ matrix.target }} --no-bundle --config '{"build":{"beforeBuildCommand":""}}' -- --locked
          python3 scripts/bundle_macos.py --report .local/verification/native-bundle-${{ matrix.portable }}.json -- \
            npm --prefix apps/desktop run tauri -- bundle --ci --target ${{ matrix.target }} --bundles app,dmg
          cargo build --manifest-path apps/native-slint/Cargo.toml --release --locked --target ${{ matrix.target }}
          python3 scripts/package_native_slint.py --binary target/${{ matrix.target }}/release/share-native-slint --target ${{ matrix.portable }} --output .local/packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.linux.outputs.product_slug }}-${{ matrix.portable }}
          path: |
            .local/packages/*
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            .local/verification/native-bundle-${{ matrix.portable }}.json
            .local/verification/native-bundle-${{ matrix.portable }}/*
          if-no-files-found: error
          retention-days: 14
