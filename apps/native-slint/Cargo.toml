[package]
name = "share-native-slint"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"

[workspace]

[features]
default = ["gui"]
gui = ["dep:slint", "dep:slint-build", "dep:rfd", "dep:arboard", "dep:sys-locale"]

[[bin]]
name = "share-native-slint"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
share-domain = { path = "../../crates/domain" }
share-host = { path = "../../crates/host" }
share-http = { path = "../../crates/http" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "accessibility", "backend-winit", "renderer-femtovg"], optional = true }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"], optional = true }
arboard = { version = "=3.7.0", default-features = false, optional = true }
sys-locale = { version = "=0.3.2", optional = true }

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
