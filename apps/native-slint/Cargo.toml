[package]
name = "share-native-slint"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"

[workspace]

[features]
default = ["gui"]
gui = ["dep:slint", "dep:slint-build", "dep:rfd", "dep:arboard", "dep:sys-locale", "dep:i-slint-core", "dep:i-slint-backend-selector"]

[[bin]]
name = "share-native-slint"
path = "src/main.rs"
required-features = ["gui"]

[[test]]
name = "preference_processes"
path = "tests/preference_processes.rs"
harness = false

[dependencies]
share-domain = { path = "../../crates/domain" }
share-host = { path = "../../crates/host" }
share-http = { path = "../../crates/http" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "accessibility", "backend-winit", "renderer-femtovg"], optional = true }
i-slint-core = { version = "=1.18.1", default-features = false, features = ["std"], optional = true }
i-slint-backend-selector = { version = "=1.18.1", default-features = false, optional = true }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"], optional = true }
arboard = { version = "=3.7.0", default-features = false, optional = true }
sys-locale = { version = "=0.3.2", optional = true }
qrcodegen = "=1.8.0"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
# Keep FemtoVG first. Slint's winit backend tries this renderer if Windows has
# no suitable OpenGL driver, including basic-display and virtual-machine hosts.
slint = { version = "=1.18.1", default-features = false, features = ["renderer-software"], optional = true }

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.1", default-features = false }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
