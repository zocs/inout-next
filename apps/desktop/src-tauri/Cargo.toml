[package]
name = "share-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"

[lib]
name = "share_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
rand = "0.9"
serde = { version = "1", features = ["derive"] }
share-domain = { path = "../../../crates/domain" }
share-host = { path = "../../../crates/host" }
share-http = { path = "../../../crates/http" }
tauri = { version = "=2.12.5", features = [] }
tokio = { version = "1", features = ["sync", "net", "io-util", "macros", "rt-multi-thread"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "=2.8.4"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
serde_json = "1"
tempfile = "3"

# This package is independent of the Rust service workspace, including when a
# checkout is nested under another workspace's ignored worktree directory.
[workspace]
