[package]
name = "share-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"

[lib]
name = "share_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
if-addrs = "=0.15.0"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
share-domain = { path = "../../../crates/domain" }
share-http = { path = "../../../crates/http" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tokio = { version = "1", features = ["sync", "net", "io-util", "macros", "rt-multi-thread"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
